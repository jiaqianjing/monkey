# Monkey's independent simplified-Chinese pinyin schema.
schema:
  schema_id: monkey_pinyin
  name: Monkey 拼音
  version: "0.2.0"
  dependencies:
    - monkey_english
    - monkey_mixed
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - name: ascii_punct
    reset: 0
    states: [中文标点, 英文标点]
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@mixed
    - script_translator
    - table_translator@english
  filters:
    - uniquifier
speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  delimiter: " '"
  algebra:
    # Standard pinyin aliases preserve exact spelling; no n/l or z/zh fuzzing.
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u$/$1v/
    # Fuzzy keyboard-error spellings carry credibility *= 0.5. The explicit
    # legal-final guard prevents a misspelling produced by one rule from
    # recursively generating many further errors. This bounds key latency.
    # Never merge n/l, z/zh, or valid -in/-ing pronunciations.
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)(.*[aeiou])ng$/$1gn/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)(.*[aeiou])n$/$1gn/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)(.*)uan$/$1aun/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)(.*)ong$/$1on/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)(.*)ao$/$1oa/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)(.+[iu])an$/$1na/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)(.*)([iu])a([ou]|ng?)$/$1a$2$3/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)([^aeiou]*)([aeiou])([a-z]+)$/$1$2$2$3/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)(.*)([aeiou])$/$1$2$2/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)([bpmfdtnlgkhjqxrzcsyw])([aeiou])(.+)$/$2$1$3/
    - fuzz/^(?=(?:[bpmfdtnlgkhjqxrzcsyw]|[zcs]h)?(?:a|ai|an|ang|ao|e|ei|en|eng|er|o|ong|ou|i|ia|ian|iang|iao|ie|in|ing|iong|iu|u|ua|uai|uan|uang|ue|ui|un|uo|v|ve)$)([gkh])uo$/$1ou/
    # Abbreviation is a distinct, lower-quality spelling class. Derive would
    # incorrectly give a one-letter syllable the same status as full pinyin.
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
translator:
  dictionary: monkey_pinyin
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 5
  preedit_format:
    - xform/([jqxy])v/$1u/
english:
  dictionary: monkey_english
  prism: monkey_english
  enable_user_dict: false
  enable_sentence: false
  enable_completion: true
  initial_quality: 0.5
  comment_format:
    - xform/.*/英文/
mixed:
  dictionary: monkey_mixed
  prism: monkey_mixed
  enable_user_dict: false
  enable_sentence: false
  enable_completion: false
  initial_quality: 5.0
  comment_format:
    - xform/.*/中英混输/
menu:
  page_size: 7
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
key_binder:
  bindings:
    - { when: composing, accept: minus, send: Page_Up }
    - { when: composing, accept: equal, send: Page_Down }
    - { when: composing, accept: bracketleft, send: Page_Up }
    - { when: composing, accept: bracketright, send: Page_Down }
recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(https?|ftp|file|www)([.:/].*)?$"
punctuator:
  half_shape:
    ',': { commit: '，' }
    '.': { commit: '。' }
    '?': { commit: '？' }
    '!': { commit: '！' }
    ':': { commit: '：' }
    ';': { commit: '；' }
    '(': '（'
    ')': '）'
    '[': '【'
    ']': '】'
    '<': '《'
    '>': '》'
    '"': { pair: ['“', '”'] }
    "'": { pair: ['‘', '’'] }
    '/': ['、', '/']
    '$': '¥'
    '_': '——'
    '^': '……'
