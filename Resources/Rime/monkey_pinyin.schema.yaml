# Monkey's independent simplified-Chinese pinyin schema.
schema:
  schema_id: monkey_pinyin
  name: Monkey 拼音
  version: "0.1.0"
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - name: ascii_punct
    reset: 0
    states: [中文标点, 英文标点]
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - derive/^([a-z]).+$/$1/
    - derive/^([zcs]h).+$/$1/
    - derive/([aeiou])ng$/$1gn/
translator:
  dictionary: monkey_pinyin
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 5
  preedit_format:
    - xform/([jqxy])v/$1u/
menu:
  page_size: 7
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
key_binder:
  bindings:
    - { when: composing, accept: minus, send: Page_Up }
    - { when: composing, accept: equal, send: Page_Down }
    - { when: composing, accept: bracketleft, send: Page_Up }
    - { when: composing, accept: bracketright, send: Page_Down }
recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?://|ftp[.]).*$"
punctuator:
  half_shape:
    ',': { commit: '，' }
    '.': { commit: '。' }
    '?': { commit: '？' }
    '!': { commit: '！' }
    ':': { commit: '：' }
    ';': { commit: '；' }
    '(': '（'
    ')': '）'
    '[': '【'
    ']': '】'
    '<': '《'
    '>': '》'
    '"': { pair: ['“', '”'] }
    "'": { pair: ['‘', '’'] }
    '/': ['、', '/']
    '$': '¥'
    '_': '——'
    '^': '……'
